<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kai Andreic</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      type="image/png"
      href="https://res.cloudinary.com/dkdwqtlzz/image/upload/v1784865705/Footprints_v2e7mq.png"
    />
    <link rel="preconnect" href="https://fonts.cdnfonts.com" crossorigin />
    <link
      href="https://fonts.cdnfonts.com/css/pp-editorial-old"
      rel="stylesheet"
    />
    <link
      href="https://fonts.cdnfonts.com/css/pp-neue-montreal"
      rel="stylesheet"
    />
    <style>
      @font-face {
        font-family: 'PP Editorial Old';
        src: url('https://db.onlinewebfonts.com/t/155c3fcab90ff316f2afaf56be1b86b4.woff2') format('woff2'),
             url('https://db.onlinewebfonts.com/t/155c3fcab90ff316f2afaf56be1b86b4.woff') format('woff'),
             url('https://db.onlinewebfonts.com/t/155c3fcab90ff316f2afaf56be1b86b4.ttf') format('truetype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      /* PP Neue Montreal — direct woff2 source, no CDN dependency */
      @font-face {
        font-family: 'PP Neue Montreal';
        src: url('https://res.cloudinary.com/dkdwqtlzz/raw/upload/PPNeueMontreal-Regular_yfclwj.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'PP Neue Montreal';
        src: url('https://res.cloudinary.com/dkdwqtlzz/raw/upload/PPNeueMontreal-Medium_v3jgep.woff2') format('woff2');
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }
    </style>
    <style>
      @font-face {
        font-family: 'Baloo Bhai 2';
        src: url('/fonts/baloobhai2-variablefont_wght.ttf') format('truetype');
        font-weight: 400 800;
        font-style: normal;
        font-display: swap;
      }
    </style>
    <style>
      @font-face {
        font-family: 'Jalnan2';
        src: url('https://cdn.jsdelivr.net/gh/webfontworld/jalnan/Jalnan2.woff2') format('woff2');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      @font-face {
        font-family: 'Beach Day';
        src: url('/fonts/beachday.otf') format('opentype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
    </style>
  </head>
  <body>
    <div
      id="site-loader"
      style="
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #fdfaf5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    "
    >
      <!-- Same line-reveal entrance as the homepage hero, so the loader
           feels like the first frame of the site rather than a generic spinner -->
      <div style="display: flex; flex-direction: column; align-items: center; line-height: 1;">
        <div
          class="site-loader-line site-loader-line-1"
          style="
          font-family: 'PP Editorial Old', 'PPEditorialOld', Georgia, serif;
          font-size: clamp(44px, 11vw, 100px);
          letter-spacing: -0.04em;
          color: #1a1a1a;
          line-height: 1;
          padding-bottom: 0.18em;
        "
        >
          Product
        </div>
        <div
          class="site-loader-line site-loader-line-2"
          style="
          font-family: 'PP Editorial Old', 'PPEditorialOld', Georgia, serif;
          font-size: clamp(44px, 11vw, 100px);
          letter-spacing: -0.04em;
          color: #1a1a1a;
          line-height: 1;
        "
        >
          Designer
        </div>
      </div>
    </div>

    <style>
      @keyframes site-loader-reveal {
        from { opacity: 0; transform: translateY(40px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .site-loader-line { opacity: 0; }
      .site-loader-line-1 {
        animation: site-loader-reveal 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
      }
      .site-loader-line-2 {
        animation: site-loader-reveal 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.25s both;
      }
    </style>

    <div id="app"></div>
    <script type="module" src="./src/index.tsx"></script>
  </body>
</html>
