<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kai Andreic</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      type="image/png"
      href="https://res.cloudinary.com/dkdwqtlzz/image/upload/v1784865705/Footprints_v2e7mq.png"
    />
    <link rel="preconnect" href="https://fonts.cdnfonts.com" crossorigin />
    <link
      href="https://fonts.cdnfonts.com/css/pp-editorial-old"
      rel="stylesheet"
    />
    <link
      href="https://fonts.cdnfonts.com/css/pp-neue-montreal"
      rel="stylesheet"
    />
    <style>
      @font-face {
        font-family: 'PP Editorial Old';
        src: url('https://db.onlinewebfonts.com/t/155c3fcab90ff316f2afaf56be1b86b4.woff2') format('woff2'),
             url('https://db.onlinewebfonts.com/t/155c3fcab90ff316f2afaf56be1b86b4.woff') format('woff'),
             url('https://db.onlinewebfonts.com/t/155c3fcab90ff316f2afaf56be1b86b4.ttf') format('truetype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      /* PP Neue Montreal — direct woff2 source, no CDN dependency */
      @font-face {
        font-family: 'PP Neue Montreal';
        src: url('https://res.cloudinary.com/dkdwqtlzz/raw/upload/PPNeueMontreal-Regular_yfclwj.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'PP Neue Montreal';
        src: url('https://res.cloudinary.com/dkdwqtlzz/raw/upload/PPNeueMontreal-Medium_v3jgep.woff2') format('woff2');
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }
    </style>
    <style>
      @font-face {
        font-family: 'Baloo Bhai 2';
        src: url('https://res.cloudinary.com/dkdwqtlzz/raw/upload/baloobhai2-variablefont_wght_oouo70.ttf') format('truetype');
        font-weight: 400 800;
        font-style: normal;
        font-display: swap;
      }
    </style>
    <style>
      @font-face {
        font-family: 'Jalnan2';
        src: url('https://cdn.jsdelivr.net/gh/webfontworld/jalnan/Jalnan2.woff2') format('woff2');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      @font-face {
        font-family: 'Beach Day';
        src: url('https://res.cloudinary.com/dkdwqtlzz/raw/upload/beachday_bwwjju.otf') format('opentype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
    </style>
  </head>
  <body>
    <div
      id="site-loader"
      style="
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #fdfaf5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    "
    >
      <!-- Black "water" rising from the bottom of the screen to the top,
           looping while the page loads, instead of the old text reveal -->
      <div class="water-loader-fill"></div>
    </div>

    <style>
      @keyframes water-loader-rise {
        0%   { height: 0%;   border-radius: 50% 50% 0 0 / 8% 8% 0 0; }
        50%  { height: 100%; border-radius: 0 0 0 0; }
        100% { height: 0%;   border-radius: 50% 50% 0 0 / 8% 8% 0 0; }
      }
      .water-loader-fill {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 0%;
        background: #1a1a1a;
        border-radius: 50% 50% 0 0 / 8% 8% 0 0;
        animation: water-loader-rise 1.8s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
    </style>

    <div id="app"></div>
    <script type="module" src="./src/index.tsx"></script>
  </body>
</html>
