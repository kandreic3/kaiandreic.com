<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kai Andreic</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <link
      rel="icon"
      type="image/png"
      href="https://res.cloudinary.com/dkdwqtlzz/image/upload/v1784865705/Footprints_v2e7mq.png"
    />
    <link rel="preconnect" href="https://fonts.cdnfonts.com" crossorigin />
    <link
      href="https://fonts.cdnfonts.com/css/pp-editorial-old"
      rel="stylesheet"
    />
    <link
      href="https://fonts.cdnfonts.com/css/pp-neue-montreal"
      rel="stylesheet"
    />
    <style>
      @font-face {
        font-family: 'PP Editorial Old';
        src: url('https://db.onlinewebfonts.com/t/155c3fcab90ff316f2afaf56be1b86b4.woff2') format('woff2'),
             url('https://db.onlinewebfonts.com/t/155c3fcab90ff316f2afaf56be1b86b4.woff') format('woff'),
             url('https://db.onlinewebfonts.com/t/155c3fcab90ff316f2afaf56be1b86b4.ttf') format('truetype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
    </style>
    <style>
      @font-face {
        font-family: 'Baloo Bhai 2';
        src: url('https://c.animaapp.com/mnnib5ym6YgLgh/img/baloobhai2-variablefont_wght.ttf') format('truetype');
        font-weight: 400 800;
        font-style: normal;
        font-display: swap;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      @font-face {
        font-family: 'Beach Day';
        src: url('https://c.animaapp.com/mnnib5ym6YgLgh/img/beachday.otf') format('opentype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
    </style>
  </head>
  <body>
    <div
      id="site-loader"
      style="
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #fdfaf5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    "
    >
      <!-- Animated dots loader -->
      <div style="display: flex; gap: 8px; align-items: center;">
        <span
          class="loader-dot"
          style="
          width: 8px; height: 8px; border-radius: 50%; background: #1a1a1a;
          animation: loaderDot 1.2s ease-in-out infinite;
          animation-delay: 0s;
          display: block;
        "
        ></span>
        <span
          class="loader-dot"
          style="
          width: 8px; height: 8px; border-radius: 50%; background: #1a1a1a;
          animation: loaderDot 1.2s ease-in-out infinite;
          animation-delay: 0.2s;
          display: block;
        "
        ></span>
        <span
          class="loader-dot"
          style="
          width: 8px; height: 8px; border-radius: 50%; background: #1a1a1a;
          animation: loaderDot 1.2s ease-in-out infinite;
          animation-delay: 0.4s;
          display: block;
        "
        ></span>
      </div>
      <p
        style="
        font-family: 'PP Neue Montreal', 'PPNouveauMontreal', sans-serif;
        font-size: 13px;
        letter-spacing: 0.08em;
        color: #888;
        margin: 0;
      "
      >
        Loading
      </p>
    </div>

    <style>
      @keyframes loaderDot {
        0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
        40%           { transform: scale(1);   opacity: 1;   }
      }
    </style>

    <div id="app"></div>
    <script type="module" src="./src/index.tsx"></script>
  </body>
</html>
