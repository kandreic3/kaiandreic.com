    <style>
      /* Rise: 0% (hidden, below the viewport) -> 100% (fully covers the
         screen). Drain (".exit"): the reverse, revealing the page beneath.
         Durations are mirrored in usePageLoader() in src/App.tsx — keep
         RISE_MS/DRAIN_MS there in sync with these. */
      .water-rise {
        position: absolute;
        inset: 0;
        transform: translateY(100%);
        animation: water-rise-in 550ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      .water-rise.exit {
        animation: water-rise-out 650ms cubic-bezier(0.55, 0, 0.55, 1) forwards;
      }
      @keyframes water-rise-in {
        from { transform: translateY(100%); }
        to   { transform: translateY(0%); }
      }
      @keyframes water-rise-out {
        from { transform: translateY(0%); }
        to   { transform: translateY(100%); }
      }
      .water-fill {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        top: 56px;
        background: #16140f;
      }
      .water-crest {
        position: absolute;
        top: 0;
        left: 0;
        width: 200%;
        height: 64px;
        display: block;
      }
      /* Two layered wave crests at different phase/amplitude/speed for a
         real, "alive" water look; their horizontal loop is independent of
         the rise/drain timing above, so speeding those up never desyncs
         or cuts the wave off mid-motion. */
      .water-crest--back {
        opacity: 0.55;
        animation: water-ripple 3400ms linear infinite;
      }
      .water-crest--front {
        animation: water-ripple 2000ms linear infinite;
      }
      @keyframes water-ripple {
        from { transform: translateX(0%); }
        to   { transform: translateX(-50%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .water-rise {
          animation: none;
          transform: translateY(0%);
        }
        .water-rise.exit {
          animation: none;
          transition: opacity 400ms ease;
          opacity: 0;
        }
        .water-crest--back, .water-crest--front {
          animation: none;
        }
      }
    </style>

    <div id="app"></div>
    <script type="module" src="./src/index.tsx"></script>
  </body>
